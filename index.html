<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Find public EV chargers around Greater Sydney, sorted by price or distance." />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#132820" media="(prefers-color-scheme: dark)" />
    <title>Sydney EV — charging map</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%230f766e'/%3E%3Cpath fill='%23fff' d='M21.2 7.5L11.5 21.2h6.1l-2.4 11.8 13.3-15.6h-6.8l2.5-9.9z'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sydney EV" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      :root {
        color-scheme: light dark;
        --bg: #e8f2ef;
        --bg-soft: linear-gradient(165deg, #e8f2ef 0%, #e0ebe8 38%, #dce8f0 100%);
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #c8d9d4;
        --accent: #0f766e;
        --accent-hover: #0d9488;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --header-tint: linear-gradient(135deg, #d8f4ef 0%, #e8faf6 45%, #dbeafe 100%);
        --toolbar-tint: linear-gradient(180deg, #ecfdf8 0%, #f8fcfb 100%);
        --shadow: 0 1px 3px rgba(15, 23, 42, 0.07);
        --radius: 12px;
        --font: "Inter", system-ui, -apple-system, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1614;
          --bg-soft: linear-gradient(165deg, #0f1614 0%, #0c1916 50%, #0d1520 100%);
          --surface: #141c19;
          --text: #ecfdf5;
          --muted: #94a3b8;
          --border: #2a3f38;
          --accent-soft: rgba(45, 212, 191, 0.15);
          --header-tint: linear-gradient(135deg, #0d2824 0%, #132820 50%, #15222e 100%);
          --toolbar-tint: linear-gradient(180deg, #132922 0%, #141c19 100%);
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg-soft);
        background-color: var(--bg);
        display: flex;
        flex-direction: column;
        min-height: 100%;
        -webkit-font-smoothing: antialiased;
      }

      .app-header {
        flex-shrink: 0;
        padding: 18px 20px 14px;
        background: var(--header-tint);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .app-header__inner {
        display: flex;
        align-items: center;
        gap: 14px;
        max-width: 1200px;
      }

      .app-logo {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        filter: drop-shadow(0 2px 6px rgba(15, 118, 110, 0.25));
      }

      .app-logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .app-header__text {
        min-width: 0;
      }

      .app-header h1 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--text);
      }

      @media (prefers-color-scheme: dark) {
        .app-header h1 {
          color: #f0fdfa;
        }
      }

      .app-header p {
        margin: 3px 0 0 0;
        font-size: 0.8125rem;
        color: var(--muted);
        font-weight: 500;
      }

      .toolbar {
        flex-shrink: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        padding: 12px 20px;
        background: var(--toolbar-tint);
        border-bottom: 1px solid var(--border);
      }

      .toolbar__label {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--muted);
      }

      .toolbar__select {
        flex: 1;
        min-width: min(200px, 100%);
        max-width: 320px;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 500;
        padding: 10px 14px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        accent-color: var(--accent);
        outline: none;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
      }

      .toolbar__select:hover {
        border-color: var(--accent);
      }

      .toolbar__select:focus {
        border-color: var(--accent);
        box-shadow:
          inset 0 1px 2px rgba(15, 23, 42, 0.04),
          0 0 0 3px var(--accent-soft);
      }

      .toolbar__btn {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 9px 14px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--accent);
        cursor: pointer;
        white-space: nowrap;
      }

      .toolbar__btn:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .toolbar__btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .main {
        flex: 1;
        min-height: 0;
        display: flex;
        width: 100%;
      }

      .main.layout--map-only #sidebar {
        display: none;
      }

      #sidebar {
        width: min(340px, 100%);
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        overflow: auto;
        padding: 16px;
        background: var(--bg);
      }

      @media (min-width: 720px) {
        #sidebar {
          width: min(340px, 38vw);
        }
      }

      #sidebar h2 {
        margin: 0 0 12px 0;
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      #sidebar .note {
        display: none;
      }

      #stationList {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #stationList li {
        margin: 0 0 8px 0;
        padding: 14px 16px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      #stationList li:hover {
        border-color: var(--accent);
        box-shadow: 0 4px 12px rgba(15, 118, 110, 0.12);
      }

      #stationList .rank {
        display: inline-block;
        min-width: 1.75rem;
        font-size: 0.75rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        margin-right: 4px;
      }

      #stationList .title {
        font-weight: 600;
        font-size: 0.9375rem;
        letter-spacing: -0.01em;
      }

      #stationList .meta {
        margin-top: 6px;
        font-size: 0.8125rem;
        color: var(--muted);
        line-height: 1.4;
      }

      #mapWrap {
        flex: 1;
        min-width: 0;
        position: relative;
        background: var(--border);
      }

      #map {
        height: 100%;
        width: 100%;
      }

      .leaflet-control-attribution {
        font-size: 10px;
      }

      .charger-marker-wrap {
        background: transparent !important;
        border: none !important;
      }

      .charger-marker {
        line-height: 0;
        filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.28));
      }

      .charger-marker svg {
        display: block;
      }

      .muted,
      .price-unknown {
        color: var(--muted);
        font-style: normal;
      }

      /* Detail panel */
      .station-detail {
        position: fixed;
        inset: 0;
        z-index: 5000;
        pointer-events: none;
      }

      .station-detail:not([hidden]) {
        pointer-events: auto;
      }

      .station-detail[hidden] {
        display: none !important;
      }

      .station-detail__backdrop {
        position: absolute;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      @media (prefers-color-scheme: dark) {
        .station-detail__backdrop {
          background: rgba(0, 0, 0, 0.55);
        }
      }

      .station-detail__sheet {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(400px, 100%);
        box-sizing: border-box;
        background: var(--surface);
        color: var(--text);
        border-left: 1px solid var(--border);
        box-shadow: -12px 0 40px rgba(15, 23, 42, 0.12);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .station-detail__top {
        flex-shrink: 0;
        padding: 16px 16px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .station-detail__top h2 {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.02em;
        flex: 1;
      }

      .station-detail__back {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
      }

      .station-detail__back:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .station-detail__body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 20px 18px 24px;
        font-size: 0.9375rem;
      }

      .detail-price {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--accent);
        margin: 0 0 16px 0;
        letter-spacing: -0.02em;
      }

      .detail-address {
        margin: 0 0 16px 0;
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.5;
      }

      .detail-callout {
        margin: 0 0 20px 0;
        padding: 12px 14px;
        font-size: 0.8125rem;
        line-height: 1.45;
        color: var(--muted);
        background: var(--bg);
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }

      .station-detail__body h3 {
        margin: 22px 0 10px 0;
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
      }

      .station-detail__body h3:first-of-type {
        margin-top: 0;
      }

      .conn-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .conn-list li {
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }

      .conn-list li:last-child {
        border-bottom: none;
      }

      .conn-list strong {
        font-weight: 600;
        color: var(--text);
      }

      .station-detail__footer {
        flex-shrink: 0;
        padding: 16px 18px 20px;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .station-detail__footer .btn-directions {
        width: 100%;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 14px 18px;
        border-radius: var(--radius);
        border: none;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }

      .station-detail__footer .btn-directions:hover {
        background: var(--accent-hover);
      }

      .detail-meta {
        margin-top: 20px;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .detail-queue-placeholder {
        margin: 0 0 22px 0;
        padding: 14px 16px;
        border-radius: var(--radius);
        border: 1px dashed var(--border);
        background: rgba(15, 118, 110, 0.06);
      }

      .detail-queue-placeholder__label {
        margin: 0 0 6px 0;
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent);
      }

      .detail-queue-placeholder p {
        margin: 0;
        font-size: 0.8125rem;
        line-height: 1.5;
        color: var(--muted);
      }

      @media (prefers-reduced-motion: reduce) {
        #stationList li {
          transition: none;
        }
      }

      .app-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 20px;
        font-size: 0.875rem;
        font-weight: 500;
        border-bottom: 1px solid var(--border);
      }

      .app-banner--loading {
        background: var(--accent-soft);
        color: var(--text);
      }

      .app-banner--error {
        background: rgba(220, 38, 38, 0.1);
        color: #b91c1c;
        border-color: rgba(220, 38, 38, 0.25);
      }

      @media (prefers-color-scheme: dark) {
        .app-banner--error {
          background: rgba(248, 113, 113, 0.12);
          color: #fca5a5;
          border-color: rgba(248, 113, 113, 0.2);
        }
      }

      .app-banner__dismiss {
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
        flex-shrink: 0;
      }

      .sidebar-hint {
        margin: 0 0 14px 0;
        padding: 12px 14px;
        font-size: 0.8125rem;
        line-height: 1.45;
        color: var(--muted);
        background: var(--surface);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
      }

      .sidebar-hint[hidden] {
        display: none !important;
      }

      /* Map marker tooltips (Leaflet adds .leaflet-tooltip) */
      .leaflet-tooltip.station-map-tip {
        padding: 0;
        border: none;
        background: transparent;
        box-shadow: none;
      }

      .station-map-tip__inner {
        max-width: 220px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
        line-height: 1.35;
      }

      .station-map-tip__name {
        font-weight: 600;
        font-size: 0.8125rem;
        margin-bottom: 2px;
      }

      .station-map-tip__price {
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 600;
      }

      .station-map-tip__compact {
        display: inline-block;
        padding: 3px 7px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--accent);
        font-size: 0.6875rem;
        font-weight: 700;
        box-shadow: var(--shadow);
        white-space: nowrap;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__inner">
        <div class="app-logo" title="Sydney EV">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="40" height="40" rx="11" fill="url(#sydneyEvLogoGrad)" />
            <path
              d="M21.2 7.5L11.5 21.2h6.1l-2.4 11.8 13.3-15.6h-6.8l2.5-9.9z"
              fill="#fff"
              fill-opacity="0.96"
            />
            <defs>
              <linearGradient id="sydneyEvLogoGrad" x1="6" y1="6" x2="36" y2="34" gradientUnits="userSpaceOnUse">
                <stop stop-color="#14b8a6" />
                <stop offset="1" stop-color="#0f766e" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="app-header__text">
          <h1>Sydney EV</h1>
          <p>Greater Sydney · map &amp; list</p>
        </div>
      </div>
    </header>
    <nav class="toolbar" id="sortBar" aria-label="Map view">
      <span class="toolbar__label" id="toolbarLabel">View</span>
      <select id="sortSelect" class="toolbar__select" aria-label="How to show stations">
        <option value="" selected>Map only (no list)</option>
        <option value="price">Lowest price first</option>
        <option value="distance">Nearest to a point</option>
      </select>
      <button id="useMyLocationBtn" type="button" class="toolbar__btn" style="display: none" title="Use your location">
        My location
      </button>
      <button id="pickOnMapBtn" type="button" class="toolbar__btn" style="display: none" title="Tap map to set point">
        Tap map
      </button>
    </nav>
    <div id="appBanner" class="app-banner app-banner--loading" role="status" aria-live="polite">
      <span id="appBannerText">Loading stations…</span>
      <button type="button" id="appBannerDismiss" class="app-banner__dismiss" hidden>Dismiss</button>
    </div>
    <div class="main layout--map-only" id="layoutMain" aria-busy="true">
      <aside id="sidebar">
        <h2 id="listTitle">Stations</h2>
        <p class="note" id="sortNote" aria-hidden="true"></p>
        <p id="sidebarHint" class="sidebar-hint" hidden></p>
        <ol id="stationList" role="list"></ol>
      </aside>
      <div id="mapWrap">
        <div id="map"></div>
      </div>
    </div>

    <div id="stationDetail" class="station-detail" hidden aria-hidden="true">
      <button type="button" class="station-detail__backdrop" id="detailBackdrop" aria-label="Close station details"></button>
      <div class="station-detail__sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div class="station-detail__top">
          <button type="button" class="station-detail__back" id="detailBackBtn">Close</button>
          <h2 id="detailTitle">Station</h2>
        </div>
        <div class="station-detail__body" id="detailBody"></div>
        <div class="station-detail__footer">
          <button type="button" class="btn-directions" id="detailNavigateBtn">Directions</button>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      const map = L.map("map", { preferCanvas: true }).setView(
        [-33.8688, 151.2093],
        10
      );

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      function escapeHtml(str) {
        return String(str ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatConnectorLine(c, idx) {
        const parts = [];
        if (typeof c.power_kw === "number") parts.push(`${escapeHtml(c.power_kw)} kW`);
        const type =
          c.connection_type != null && String(c.connection_type).trim() !== ""
            ? escapeHtml(c.connection_type)
            : null;
        if (type) parts.push(type);
        if (typeof c.quantity === "number") {
          const q = c.quantity;
          parts.push(q === 1 ? "1 plug" : `${escapeHtml(q)} plugs of this kind`);
        }
        const line = parts.length ? parts.join(" · ") : "Details not listed";
        return `<li><strong>Connector ${idx + 1}</strong> — ${line}</li>`;
      }

      function buildQueueRoadmapHtml() {
        return `<h3>Queue</h3><div class="detail-queue-placeholder" role="status">
          <p class="detail-queue-placeholder__label">Coming later</p>
          <p>No live data yet. In a future version we plan to show <strong>vehicles waiting</strong> or an estimated wait when real-time feeds (e.g. from networks) are available—so you can judge congestion before heading here.</p>
        </div>`;
      }

      function buildConnectionsDetailHtml(s) {
        const conns = Array.isArray(s.connections) ? s.connections : [];
        if (!conns.length) {
          return `<p class="muted">No connector rows for this site in the feed.</p>
            <p class="detail-callout">Check plug type and availability on site or in your charging app.</p>`;
        }
        const items = conns.map((c, i) => formatConnectorLine(c, i)).join("");
        return `<ul class="conn-list">${items}</ul>
          <p class="detail-callout">Listing may be incomplete—verify on site or in your charging app.</p>`;
      }

      function buildStationDetailHtml(s, refLat, refLon) {
        let priceHtml;
        if (s.usage_cost_raw) {
          priceHtml = escapeHtml(s.usage_cost_raw);
        } else if (getNumericPrice(s) !== null) {
          priceHtml = escapeHtml(String(getNumericPrice(s)));
        } else {
          priceHtml = `<span class="muted">Unknown</span>`;
        }

        const addr = [s.address_line1, s.town, s.state, s.postcode].filter(Boolean).map(escapeHtml).join(", ");
        const addressBlock = addr ? `<p class="detail-address">${addr}</p>` : "";

        const operator = s.operator
          ? `<p class="detail-address" style="margin-top:-8px">${escapeHtml(s.operator)}</p>`
          : "";

        let distHtml = "";
        if (
          refLat != null &&
          refLon != null &&
          typeof s.lat === "number" &&
          typeof s.lon === "number"
        ) {
          const km = haversineKm(refLat, refLon, s.lat, s.lon);
          const txt = km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
          distHtml = `<p class="detail-address"><span class="muted">About ${escapeHtml(txt)} from your point (straight line)</span></p>`;
        }

        let meta = "";
        if (typeof s.last_seen_epoch === "number" && s.last_seen_epoch > 0) {
          try {
            const d = new Date(s.last_seen_epoch * 1000);
            meta = `<p class="detail-meta">Listing updated ${escapeHtml(d.toLocaleDateString())}</p>`;
          } catch {
            /* ignore */
          }
        }

        return (
          `<p class="detail-price">${priceHtml}</p>` +
          operator +
          addressBlock +
          distHtml +
          buildQueueRoadmapHtml() +
          buildConnectionsDetailHtml(s) +
          meta
        );
      }

      function mapsDirectionsUrl(lat, lon) {
        const a = encodeURIComponent(`${lat},${lon}`);
        return `https://www.google.com/maps/dir/?api=1&destination=${a}`;
      }

      async function loadStations() {
        const res = await fetch("./data/stations.json", { cache: "no-cache" });
        if (!res.ok) throw new Error(`Failed to fetch stations.json: ${res.status}`);
        return await res.json();
      }

      function markerColor(s) {
        return s.price_available ? "#0f766e" : "#94a3b8";
      }

      /** Pin-shaped marker with charging bolt (DivIcon — not a plain circle). */
      function chargerMarkerHtml(fillColor) {
        const c = escapeHtml(fillColor);
        return `<div class="charger-marker" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" width="30" height="38">
            <path
              fill="${c}"
              d="M16 1C9.5 1 4.2 6.1 4.2 12.4c0 8.9 7.8 17.8 11.8 25.6 3.9-7.8 11.8-16.7 11.8-25.6C27.8 6.1 22.5 1 16 1z"
            />
            <path
              fill="#fff"
              fill-opacity="0.95"
              d="M17.8 9.2L12 17.4h3.4L14 25.5l7.2-9.2h-3.2l2.8-7.1z"
            />
          </svg>
        </div>`;
      }

      function stationMarker(s) {
        const fill = markerColor(s);
        return L.marker([s.lat, s.lon], {
          icon: L.divIcon({
            className: "charger-marker-wrap",
            html: chargerMarkerHtml(fill),
            iconSize: [30, 38],
            iconAnchor: [15, 38],
            tooltipAnchor: [0, -34],
            popupAnchor: [0, -32],
          }),
        });
      }

      function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const toRad = (d) => (d * Math.PI) / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      /** Parsed numeric price for sorting; null if missing or not a usable number. */
      function getNumericPrice(s) {
        if (!s) return null;
        const v = s.price_sort_value;
        if (typeof v === "number" && Number.isFinite(v)) return v;
        if (typeof v === "string" && v.trim() !== "") {
          const n = parseFloat(v);
          if (Number.isFinite(n)) return n;
        }
        return null;
      }

      /** Ascending by price; unknown price sorts after known (for distance tie-break only). */
      function comparePriceAscending(a, b) {
        const pa = getNumericPrice(a);
        const pb = getNumericPrice(b);
        if (pa !== null && pb !== null && pa !== pb) return pa - pb;
        if (pa !== null && pb === null) return -1;
        if (pa === null && pb !== null) return 1;
        const na = String(a.name || "").toLowerCase();
        const nb = String(b.name || "").toLowerCase();
        if (na < nb) return -1;
        if (na > nb) return 1;
        return (a.id || 0) - (b.id || 0);
      }

      function compareByDistance(a, b, refLat, refLon) {
        const da = haversineKm(refLat, refLon, a.lat, a.lon);
        const db = haversineKm(refLat, refLon, b.lat, b.lon);
        if (da !== db) return da - db;
        return comparePriceAscending(a, b);
      }

      /** Plain-language price for map labels / tooltips. */
      function stationPriceLabel(s) {
        if (!s) return "—";
        if (s.usage_cost_raw) return String(s.usage_cost_raw);
        const n = getNumericPrice(s);
        if (n !== null) return String(n);
        return "Unknown";
      }

      function stationTooltipHtml(s, compact) {
        const price = escapeHtml(stationPriceLabel(s));
        if (compact) {
          return `<span class="station-map-tip__compact" title="${escapeHtml(s.name || "Station")}">${price}</span>`;
        }
        const name = escapeHtml(s.name || "Station");
        return `<div class="station-map-tip__inner"><div class="station-map-tip__name">${name}</div><div class="station-map-tip__price">${price}</div></div>`;
      }

      const MACOS_GEO_HELP =
        " Mac: System Settings → Privacy & Security → Location Services → On, then enable your browser (Safari/Chrome). " +
        "Safari: Safari → Settings → Websites → Location → allow for 127.0.0.1.";

      function geolocationErrorMessage(err) {
        if (!err) return "Unknown error.";
        if (typeof err.code === "number") {
          if (err.code === 1) {
            return (
              "Permission denied. Allow location for this site, and turn on Location Services for your browser." +
              MACOS_GEO_HELP
            );
          }
          if (err.code === 2) {
            return (
              "Position unavailable (Wi‑Fi/location services). Turn on Wi‑Fi, disable VPN, or use “Choose point on map”." +
              MACOS_GEO_HELP
            );
          }
          if (err.code === 3) {
            return "Timed out. Try again, or use “Choose point on map”.";
          }
        }
        return err.message || String(err);
      }

      async function geolocationPermissionState() {
        try {
          if (!navigator.permissions || !navigator.permissions.query) return null;
          const r = await navigator.permissions.query({ name: "geolocation" });
          return r.state;
        } catch {
          return null;
        }
      }

      /**
       * Browsers only expose GPS in a “secure context”: https, or http://localhost / http://127.0.0.1.
       */
      async function requestUserLocation() {
        if (!navigator.geolocation) {
          throw new Error("Your browser does not support geolocation.");
        }
        if (window.isSecureContext === false) {
          throw new Error(
            "INSECURE_CONTEXT: Open this app as http://127.0.0.1:PORT/ (same computer) or use HTTPS. " +
              "Geolocation is blocked on plain http:// with a non-localhost address."
          );
        }

        const once = (highAccuracy, timeoutMs) =>
          new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, {
              enableHighAccuracy: highAccuracy,
              timeout: timeoutMs,
              maximumAge: 0,
            });
          });

        /** Some Mac/desktop setups return a fix faster with watchPosition than getCurrentPosition. */
        const watchFirstFix = (highAccuracy, maxWaitMs) =>
          new Promise((resolve, reject) => {
            let settled = false;
            let watchId = null;
            const finish = (fn) => {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              if (watchId != null) navigator.geolocation.clearWatch(watchId);
              fn();
            };
            const timer = setTimeout(() => {
              finish(() => reject(Object.assign(new Error("watch timeout"), { code: 3 })));
            }, maxWaitMs);
            watchId = navigator.geolocation.watchPosition(
              (pos) => finish(() => resolve(pos)),
              (err) => finish(() => reject(err)),
              { enableHighAccuracy: highAccuracy, maximumAge: 0 }
            );
          });

        const attempts = [
          () => once(true, 12000),
          () => once(false, 28000),
          () => watchFirstFix(false, 22000),
          () => watchFirstFix(true, 18000),
        ];

        let lastErr = null;
        for (const run of attempts) {
          try {
            const pos = await run();
            return { lat: pos.coords.latitude, lon: pos.coords.longitude };
          } catch (e) {
            lastErr = e;
          }
        }
        throw lastErr || new Error("Geolocation failed.");
      }

      (async () => {
        const appBanner = document.getElementById("appBanner");
        const appBannerText = document.getElementById("appBannerText");
        const appBannerDismiss = document.getElementById("appBannerDismiss");
        const layoutMain = document.getElementById("layoutMain");
        const sortSelect = document.getElementById("sortSelect");
        const useMyLocationBtn = document.getElementById("useMyLocationBtn");
        const pickOnMapBtn = document.getElementById("pickOnMapBtn");

        function showAppBanner(kind, message, dismissable) {
          appBanner.hidden = false;
          appBanner.className = `app-banner app-banner--${kind}`;
          appBannerText.textContent = message;
          appBannerDismiss.hidden = !dismissable;
        }

        function hideAppBanner() {
          appBanner.hidden = true;
        }

        sortSelect.disabled = true;
        useMyLocationBtn.disabled = true;
        pickOnMapBtn.disabled = true;
        showAppBanner("loading", "Loading stations…", false);

        try {
          const payload = await loadStations();
          const stations = payload.stations || [];

          hideAppBanner();
          layoutMain.setAttribute("aria-busy", "false");
          sortSelect.disabled = false;
          useMyLocationBtn.disabled = false;
          pickOnMapBtn.disabled = false;

          const sortNoteEl = document.getElementById("sortNote");
          const listTitleEl = document.getElementById("listTitle");
          const sidebarHint = document.getElementById("sidebarHint");

          const markerById = new Map();
          const listEl = document.getElementById("stationList");
          const stationDetailEl = document.getElementById("stationDetail");
          const detailBodyEl = document.getElementById("detailBody");
          const detailTitleEl = document.getElementById("detailTitle");
          const detailBackdrop = document.getElementById("detailBackdrop");
          const detailBackBtn = document.getElementById("detailBackBtn");
          const detailNavigateBtn = document.getElementById("detailNavigateBtn");

          let detailOpenStation = null;
          let detailFocusBeforeOpen = null;

          function setSidebarHint(show, message) {
            if (show) {
              sidebarHint.hidden = false;
              sidebarHint.textContent = message;
            } else {
              sidebarHint.hidden = true;
              sidebarHint.textContent = "";
            }
          }

          const mapStations = stations.filter((s) => typeof s.lat === "number" && typeof s.lon === "number");

          const stationLayer = L.layerGroup();
          let stationsVisible = false;

          let userDot = null;
          let refLat = null;
          let refLon = null;

          let mapPickHandler = null;

          function setReferenceOnMap(lat, lon, popupTitle) {
            if (userDot) map.removeLayer(userDot);
            userDot = L.circleMarker([lat, lon], {
              radius: 8,
              color: "#0f766e",
              weight: 2,
              fillColor: "#14b8a6",
              fillOpacity: 0.9,
            }).addTo(map);
            userDot.bindPopup(escapeHtml(popupTitle || "Reference point"));
            refLat = lat;
            refLon = lon;
          }

          function clearReferenceDot() {
            if (userDot) {
              map.removeLayer(userDot);
              userDot = null;
            }
            refLat = null;
            refLon = null;
          }

          function showStationPins() {
            if (stationsVisible) return;
            stationLayer.addTo(map);
            stationsVisible = true;
          }

          function hideStationPins() {
            if (!stationsVisible) return;
            map.removeLayer(stationLayer);
            stationsVisible = false;
          }

          function cancelMapPick() {
            if (mapPickHandler) {
              map.off("click", mapPickHandler);
              mapPickHandler = null;
            }
            map.getContainer().style.cursor = "";
          }

          function clearStationList() {
            listEl.innerHTML = "";
          }

          function priceLineHtml(s) {
            if (s.usage_cost_raw) return escapeHtml(s.usage_cost_raw);
            const num = getNumericPrice(s);
            if (num !== null) return escapeHtml(String(num));
            return '<span class="price-unknown">Price unknown</span>';
          }

          function distanceLineHtml(s, refLat, refLon) {
            const km = haversineKm(refLat, refLon, s.lat, s.lon);
            const txt = km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
            return `${escapeHtml(txt)} away`;
          }

          function closeStationDetail() {
            stationDetailEl.hidden = true;
            stationDetailEl.setAttribute("aria-hidden", "true");
            detailOpenStation = null;
            if (detailFocusBeforeOpen && typeof detailFocusBeforeOpen.focus === "function") {
              try {
                detailFocusBeforeOpen.focus();
              } catch {
                /* ignore */
              }
            }
            detailFocusBeforeOpen = null;
          }

          function openStationDetail(s) {
            detailFocusBeforeOpen = document.activeElement;
            detailOpenStation = s;
            detailTitleEl.textContent = s.name || "Unnamed station";
            detailBodyEl.innerHTML = buildStationDetailHtml(s, refLat, refLon);
            stationDetailEl.hidden = false;
            stationDetailEl.setAttribute("aria-hidden", "false");
            const mk = markerById.get(s.id);
            if (mk) {
              map.setView(mk.getLatLng(), Math.max(map.getZoom(), 15));
            } else if (typeof s.lat === "number" && typeof s.lon === "number") {
              map.setView([s.lat, s.lon], Math.max(map.getZoom(), 15));
            }
            requestAnimationFrame(() => detailBackBtn.focus());
          }

          detailBackdrop.addEventListener("click", closeStationDetail);
          detailBackBtn.addEventListener("click", closeStationDetail);
          detailNavigateBtn.addEventListener("click", () => {
            if (!detailOpenStation || typeof detailOpenStation.lat !== "number" || typeof detailOpenStation.lon !== "number") {
              return;
            }
            window.open(
              mapsDirectionsUrl(detailOpenStation.lat, detailOpenStation.lon),
              "_blank",
              "noopener,noreferrer"
            );
          });

          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && detailOpenStation && !stationDetailEl.hidden) {
              closeStationDetail();
            }
          });

          appBannerDismiss.addEventListener("click", hideAppBanner);

          function stationAriaLabel(s, mode, refLat, refLon) {
            const name = s.name || "Station";
            let price = s.usage_cost_raw || "";
            if (!price && getNumericPrice(s) !== null) price = String(getNumericPrice(s));
            if (!price) price = "price unknown";
            if (mode === "distance" && refLat != null && refLon != null) {
              const km = haversineKm(refLat, refLon, s.lat, s.lon);
              const d = km < 1 ? `${Math.round(km * 1000)} metres` : `${km.toFixed(1)} kilometres`;
              return `${name}, ${price}, about ${d} away`;
            }
            return `${name}, ${price}`;
          }

          function renderStationList(sorted, mode, refLat, refLon) {
            setSidebarHint(false, "");
            listEl.innerHTML = "";
            sorted.forEach((s, idx) => {
              const li = document.createElement("li");
              const distPart =
                mode === "distance" && refLat != null && refLon != null
                  ? ` · ${distanceLineHtml(s, refLat, refLon)}`
                  : "";
              li.innerHTML = `<div><span class="rank">${idx + 1}</span><span class="title">${escapeHtml(
                s.name || "Unnamed"
              )}</span></div><div class="meta">${priceLineHtml(s)}${distPart}</div>`;
              li.setAttribute("role", "button");
              li.tabIndex = 0;
              li.setAttribute("aria-label", stationAriaLabel(s, mode, refLat, refLon));
              const open = () => openStationDetail(s);
              li.addEventListener("click", open);
              li.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  open();
                }
              });
              listEl.appendChild(li);
            });
          }

          function syncDistanceControls() {
            const isDist = sortSelect.value === "distance";
            useMyLocationBtn.style.display = isDist ? "inline-block" : "none";
            pickOnMapBtn.style.display = isDist ? "inline-block" : "none";
            if (!isDist) {
              useMyLocationBtn.disabled = false;
              pickOnMapBtn.disabled = false;
            }
          }

          function setListPanelVisible(show) {
            layoutMain.classList.toggle("layout--map-only", !show);
            requestAnimationFrame(() => map.invalidateSize());
          }

          function applyNoneMode() {
            cancelMapPick();
            listTitleEl.textContent = "Stations";
            sortNoteEl.textContent = "";
            setSidebarHint(false, "");
            listEl.innerHTML = "";
            repopulateStationPins(() => true);
            showStationPins();
            clearReferenceDot();
            setListPanelVisible(false);
            syncDistanceControls();
          }

          function repopulateStationPins(predicate) {
            stationLayer.clearLayers();
            for (const { s, m } of allStationMarkers) {
              if (predicate(s)) stationLayer.addLayer(m);
            }
          }

          function applyPriceMode() {
            cancelMapPick();
            clearReferenceDot();
            setSidebarHint(false, "");
            setListPanelVisible(true);
            listTitleEl.textContent = "Lowest price";
            sortNoteEl.textContent = "";

            const priced = mapStations.filter((s) => getNumericPrice(s) !== null);
            const sorted = [...priced].sort(comparePriceAscending);

            repopulateStationPins((s) => getNumericPrice(s) !== null);
            showStationPins();

            if (sorted.length === 0) {
              clearStationList();
            } else {
              renderStationList(sorted, "price", null, null);
              const pricedMarkers = sorted.map((s) => markerById.get(s.id)).filter(Boolean);
              if (pricedMarkers.length) {
                map.fitBounds(L.featureGroup(pricedMarkers).getBounds().pad(0.08));
              }
            }
            syncDistanceControls();
          }

          function applyDistanceModeAwaitingOrigin() {
            cancelMapPick();
            clearReferenceDot();
            setListPanelVisible(true);
            listTitleEl.textContent = "Nearest first";
            sortNoteEl.textContent = "";
            hideStationPins();
            clearStationList();
            setSidebarHint(
              true,
              "Choose My location, or Tap map and click the map once to set where distances are measured from."
            );
            syncDistanceControls();
          }

          function applyDistanceWithOrigin(lat, lon, label) {
            cancelMapPick();
            setListPanelVisible(true);
            setReferenceOnMap(lat, lon, label);
            setSidebarHint(false, "");
            listTitleEl.textContent = "Nearest first";
            sortNoteEl.textContent = "";
            repopulateStationPins(() => true);
            showStationPins();
            const sorted = [...mapStations].sort((a, b) => compareByDistance(a, b, lat, lon));
            renderStationList(sorted, "distance", lat, lon);
            syncDistanceControls();
          }

          function onSortSelectChange() {
            const mode = sortSelect.value;
            if (mode === "") {
              applyNoneMode();
            } else if (mode === "price") {
              applyPriceMode();
            } else if (mode === "distance") {
              applyDistanceModeAwaitingOrigin();
            }
          }

          sortSelect.addEventListener("change", onSortSelectChange);

          useMyLocationBtn.addEventListener("click", async () => {
            if (sortSelect.value !== "distance") return;

            const perm = await geolocationPermissionState();
            if (perm === "denied") {
              alert(
                "This site’s location permission is blocked.\n\n" +
                  "Fix: click the lock/site icon in the address bar → Location → Allow.\n" +
                  "Also enable Location Services for your browser in Mac System Settings → Privacy & Security → Location Services."
              );
              sortNoteEl.textContent = "";
              return;
            }

            useMyLocationBtn.disabled = true;
            pickOnMapBtn.disabled = true;
            sortNoteEl.textContent = "";
            try {
              const loc = await requestUserLocation();
              applyDistanceWithOrigin(loc.lat, loc.lon, "Device location (approx.)");
            } catch (e) {
              console.error(e);
              let detail = geolocationErrorMessage(e);
              if (e && typeof e.message === "string" && e.message.startsWith("INSECURE_CONTEXT:")) {
                detail = e.message.replace(/^INSECURE_CONTEXT:\s*/, "");
                alert(detail);
              } else if (e && typeof e.code === "number" && (e.code === 1 || e.code === 2)) {
                alert(detail);
              }
              sortNoteEl.textContent = "";
              applyDistanceModeAwaitingOrigin();
            } finally {
              useMyLocationBtn.disabled = false;
              pickOnMapBtn.disabled = false;
            }
          });

          pickOnMapBtn.addEventListener("click", () => {
            if (sortSelect.value !== "distance") return;
            cancelMapPick();
            clearReferenceDot();
            hideStationPins();
            clearStationList();
            sortNoteEl.textContent = "";
            map.getContainer().style.cursor = "crosshair";

            mapPickHandler = (e) => {
              cancelMapPick();
              applyDistanceWithOrigin(e.latlng.lat, e.latlng.lng, "Point you chose on the map");
            };
            map.on("click", mapPickHandler);
          });

          function attachStationTooltip(s, m) {
            const compact = map.getZoom() >= 14;
            m.bindTooltip(stationTooltipHtml(s, compact), {
              direction: "top",
              sticky: true,
              opacity: 1,
              className: "station-map-tip" + (compact ? " station-map-tip--permanent" : ""),
              permanent: compact,
            });
          }

          const allStationMarkers = [];
          const markers = [];
          for (const s of mapStations) {
            const m = stationMarker(s).on("click", (evt) => {
              if (evt.originalEvent) L.DomEvent.stopPropagation(evt.originalEvent);
              openStationDetail(s);
            });
            attachStationTooltip(s, m);
            allStationMarkers.push({ s, m });
            markers.push(m);
            if (typeof s.id === "number") markerById.set(s.id, m);
          }

          map.on("zoomend", () => {
            for (const { s, m } of allStationMarkers) {
              m.unbindTooltip();
              attachStationTooltip(s, m);
            }
          });

          repopulateStationPins(() => true);

          sortSelect.value = "";
          applyNoneMode();

          if (markers.length) {
            const group = L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.08));
          }
        } catch (e) {
          console.error(e);
          layoutMain.setAttribute("aria-busy", "false");
          sortSelect.disabled = true;
          useMyLocationBtn.disabled = true;
          pickOnMapBtn.disabled = true;
          showAppBanner(
            "error",
            "Could not load stations. Check that web/data/stations.json exists and you are using a local web server (not opening the file directly).",
            true
          );
        }
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
